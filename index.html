<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft Night — a little auction game for two to five people</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>" />
<style>
  :root {
    --bg: #f6efe0;
    --panel: #fffaf1;
    --line: #ddceac;
    --accent: #5c7a52;
    --accent-dark: #45603d;
    --text: #332c1f;
    --muted: #857a5f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 760px; margin: 0 auto; padding: 32px 16px; display: flex; flex-direction: column; gap: 24px; }
  a { color: inherit; }
  h1 { font-size: 1.75rem; font-weight: 800; margin: 0; }
  h2 { font-size: 1.25rem; font-weight: 700; margin: 0; }
  p { line-height: 1.55; }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }
  .xs { font-size: 0.72rem; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: 0 1px 2px rgba(80,60,20,0.04); }
  .panel.turn { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(92,122,82,0.15); }
  .btn { border-radius: 12px; padding: 10px 18px; font-weight: 600; border: none; cursor: pointer; font-size: 0.95rem; font-family: inherit; }
  .btn-primary { background: var(--accent); color: #fdfaf1; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent-dark); }
  .btn-ghost:disabled { opacity: 0.5; cursor: default; }
  .input, select, textarea { background: #fffef9; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text); width: 100%; font-size: 0.95rem; font-family: inherit; }
  .input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label span { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  nav { display: flex; justify-content: space-between; align-items: center; }
  nav .brand { font-weight: 800; }
  nav .links { display: flex; gap: 16px; font-size: 0.9rem; align-items: center; }
  ol.roster { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  ol.roster li { display: flex; justify-content: space-between; font-size: 0.8rem; color: #574f3c; }
  .code { font-size: 2.5rem; font-family: ui-monospace, monospace; letter-spacing: 0.3em; color: var(--accent-dark); }
  .bar-track { height: 8px; width: 100%; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); transition: width 0.1s linear; }
  .error { color: #a24a3a; font-size: 0.9rem; }
  .steps { display: flex; flex-direction: column; gap: 10px; padding-left: 18px; }
  #results-board { width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; margin: 0 auto; }
  .chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; background: #eee3c8; font-size: 0.72rem; color: var(--accent-dark); font-weight: 600; }
  .room-wrap { display: flex; gap: 20px; align-items: flex-start; }
  .room-wrap > #body { flex: 1; min-width: 0; }
  .room-wrap > #sidebar { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  @media (max-width: 760px) {
    .room-wrap { flex-direction: column; }
    .room-wrap > #sidebar { width: 100%; }
  }
  .tabrow { display: flex; border-bottom: 1px solid var(--line); }
  .tabbtn { flex: 1; background: none; border: none; padding: 10px; font-weight: 700; color: var(--muted); cursor: pointer; font-family: inherit; font-size: 0.82rem; }
  .tabbtn.active { color: var(--accent-dark); box-shadow: inset 0 -2px 0 var(--accent); }
  .tabpane { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  #chatMessages { height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .chat-bubble { padding: 6px 10px; border-radius: 10px; font-size: 0.85rem; }
</style>
</head>
<body>
<div id="app"><p class="muted">Getting things ready…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
<script>
/* ---------- tiny helpers ---------- */
const $app = document.getElementById("app");
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const CATEGORIES = ["soccer", "movies", "pop icons", "custom"];

async function api(path, opts) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch(path, { ...opts, signal: controller.signal });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Request failed.");
    return data;
  } finally {
    clearTimeout(timeout);
  }
}

/* ---------- supabase (config fetched from /api/config) ---------- */
let sbClient = null;
let currentUser = null;
let currentUsername = null;

async function initSupabase() {
  try {
    const cfg = await api("/api/config");
    if (cfg.supabaseUrl && cfg.supabaseAnonKey) {
      sbClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
        auth: { flowType: "pkce", detectSessionInUrl: true },
      });
      const { data } = await sbClient.auth.getUser();
      currentUser = data.user || null;
      if (currentUser) await loadProfile();
      // clean up any leftover ?code=... from a magic-link redirect
      if (location.search.includes("code=")) {
        history.replaceState({}, "", location.pathname + location.hash);
      }
    }
  } catch (e) {
    console.warn("Accounts not reachable yet:", e.message);
  }
}

async function loadProfile() {
  if (!sbClient || !currentUser) return;
  const { data } = await sbClient.from("profiles").select("username").eq("id", currentUser.id).maybeSingle();
  currentUsername = data ? data.username : null;
}

/* ---------- router ---------- */
function navigate(hash) { location.hash = hash; }
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", () => {
  render(); // show something immediately, never block the first paint on a network call
  initSupabase().then(() => {
    if (currentUser && !currentUsername) { navigate("/username"); return; }
    const hash = location.hash.replace(/^#/, "") || "/";
    if (hash === "/" || hash.startsWith("/login") || hash.startsWith("/history") || hash.startsWith("/new") || hash.startsWith("/join")) render();
  });
});

let pollTimer = null;
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

let sidebarCleanup = null;
function stopSidebar() { if (sidebarCleanup) { sidebarCleanup(); sidebarCleanup = null; } }

let latestRoomState = null; // updated by draw() so chat/voice can look up player names
let activeVoiceContext = null; // { code, seat } while mic is live, for the unload safety net

const ICE_SERVERS = [{ urls: "stun:stun.l.google.com:19302" }];

/* ---------- chat + voice sidebar (built once per room visit, never torn down) ---------- */
function setupSidebar(code, seat) {
  const chatMessagesEl = document.getElementById("chatMessages");
  const chatForm = document.getElementById("chatForm");
  const chatInput = document.getElementById("chatInput");

  let chatCursor = 0;
  async function pollChat() {
    try {
      const data = await api(`/api/room-chat?code=${code}&since=${chatCursor}`);
      chatCursor = data.nextIndex;
      data.items.forEach((msg) => appendChatMessage(chatMessagesEl, msg, seat));
    } catch (e) { /* transient — next poll retries */ }
  }
  function appendChatMessage(container, msg, mySeat) {
    const mine = msg.seat === mySeat;
    container.appendChild(el(`
      <div style="align-self:${mine ? "flex-end" : "flex-start"};max-width:85%;">
        <p class="xs muted" style="margin:0 0 2px;">${escapeHtml(msg.name)}</p>
        <p class="chat-bubble" style="background:${mine ? "var(--accent)" : "#eee3c8"};color:${mine ? "#fdfaf1" : "var(--text)"};margin:0;">${escapeHtml(msg.text)}</p>
      </div>
    `));
    container.scrollTop = container.scrollHeight;
  }
  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = chatInput.value.trim();
    if (!text || seat === null) return;
    chatInput.value = "";
    try {
      await api("/api/room-chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, seat, text }),
      });
    } catch (err) { /* keep it simple — message just won't appear, they can retype */ }
  });
  pollChat();
  const chatTimer = setInterval(pollChat, 2000);

  /* ---- voice ---- */
  const voiceToggleBtn = document.getElementById("voiceToggleBtn");
  const muteToggleBtn = document.getElementById("muteToggleBtn");
  const voiceRosterEl = document.getElementById("voiceRoster");
  const voice = { joined: false, stream: null, peers: {}, audios: {}, sigCursor: 0, presenceTimer: null, sigTimer: null };

  function nameForSeat(s) {
    if (latestRoomState && latestRoomState.players && latestRoomState.players[s]) return latestRoomState.players[s].name;
    return "seat " + s;
  }

  function updateVoiceRoster(seats) {
    if (!voiceRosterEl) return;
    if (seats.length === 0) { voiceRosterEl.textContent = "Nobody's in voice yet."; return; }
    voiceRosterEl.textContent = "In voice: " + seats.map((s) => (s === seat ? "you" : nameForSeat(s))).join(", ");
  }

  function createPeerConnection(otherSeat) {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    voice.stream.getTracks().forEach((t) => pc.addTrack(t, voice.stream));
    pc.onicecandidate = (e) => { if (e.candidate) sendSignal(otherSeat, "ice", e.candidate.toJSON()); };
    pc.ontrack = (e) => {
      let audio = voice.audios[otherSeat];
      if (!audio) {
        audio = document.createElement("audio");
        audio.autoplay = true;
        document.body.appendChild(audio);
        voice.audios[otherSeat] = audio;
      }
      audio.srcObject = e.streams[0];
    };
    return pc;
  }

  async function sendSignal(toSeat, kind, payload) {
    try {
      await api("/api/room-signal", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, fromSeat: seat, toSeat, kind, payload }),
      });
    } catch (e) { /* the periodic presence/signal poll will retry the connection */ }
  }

  async function initiateConnection(otherSeat) {
    const pc = createPeerConnection(otherSeat);
    voice.peers[otherSeat] = pc;
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await sendSignal(otherSeat, "offer", offer);
  }

  async function handleSignal(sig) {
    const other = sig.fromSeat;
    let pc = voice.peers[other];
    if (sig.kind === "offer") {
      if (!pc) { pc = createPeerConnection(other); voice.peers[other] = pc; }
      await pc.setRemoteDescription(new RTCSessionDescription(sig.payload));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await sendSignal(other, "answer", answer);
    } else if (sig.kind === "answer") {
      if (pc) await pc.setRemoteDescription(new RTCSessionDescription(sig.payload));
    } else if (sig.kind === "ice") {
      if (pc) { try { await pc.addIceCandidate(new RTCIceCandidate(sig.payload)); } catch (e) { /* benign — late/duplicate candidate */ } }
    }
  }

  function teardownPeer(otherSeat) {
    const pc = voice.peers[otherSeat];
    if (pc) { pc.close(); delete voice.peers[otherSeat]; }
    const audio = voice.audios[otherSeat];
    if (audio) { audio.remove(); delete voice.audios[otherSeat]; }
  }

  async function pollPresence() {
    try {
      const { seats } = await api(`/api/room-voice-presence?code=${code}`);
      updateVoiceRoster(seats);
      seats.forEach((other) => {
        if (other === seat || voice.peers[other]) return;
        if (other > seat) initiateConnection(other); // lower seat always initiates — avoids duplicate offers
      });
      Object.keys(voice.peers).forEach((s) => { if (!seats.includes(Number(s))) teardownPeer(Number(s)); });
    } catch (e) { /* transient — next poll retries */ }
  }

  async function pollSignals() {
    try {
      const { items, nextIndex } = await api(`/api/room-signal?code=${code}&since=${voice.sigCursor}`);
      voice.sigCursor = nextIndex;
      for (const sig of items) {
        if (sig.toSeat !== seat) continue;
        await handleSignal(sig);
      }
    } catch (e) { /* transient — next poll retries */ }
  }

  async function joinVoice() {
    try {
      voice.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      alert("Couldn't access your microphone: " + e.message);
      return false;
    }
    voice.joined = true;
    activeVoiceContext = { code, seat };
    await api("/api/room-voice-presence", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, seat, action: "join" }),
    });
    pollPresence();
    voice.presenceTimer = setInterval(pollPresence, 3000);
    voice.sigTimer = setInterval(pollSignals, 1000);
    return true;
  }

  async function leaveVoice() {
    clearInterval(voice.presenceTimer);
    clearInterval(voice.sigTimer);
    Object.keys(voice.peers).forEach((s) => teardownPeer(Number(s)));
    if (voice.stream) voice.stream.getTracks().forEach((t) => t.stop());
    voice.joined = false;
    activeVoiceContext = null;
    try {
      await api("/api/room-voice-presence", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, seat, action: "leave" }),
      });
    } catch (e) { /* best effort */ }
  }

  if (seat === null) {
    voiceToggleBtn.disabled = true;
    voiceToggleBtn.textContent = "Join the room to use voice";
  }
  voiceToggleBtn.addEventListener("click", async () => {
    if (seat === null) return;
    if (!voice.joined) {
      voiceToggleBtn.disabled = true; voiceToggleBtn.textContent = "Connecting…";
      const ok = await joinVoice();
      voiceToggleBtn.disabled = false;
      if (ok) { voiceToggleBtn.textContent = "Leave voice"; muteToggleBtn.style.display = "inline-block"; }
      else { voiceToggleBtn.textContent = "🎙️ Join voice"; }
    } else {
      await leaveVoice();
      voiceToggleBtn.textContent = "🎙️ Join voice";
      muteToggleBtn.style.display = "none";
    }
  });
  muteToggleBtn.addEventListener("click", () => {
    if (!voice.stream) return;
    const track = voice.stream.getAudioTracks()[0];
    track.enabled = !track.enabled;
    muteToggleBtn.textContent = track.enabled ? "Mute" : "Unmute";
  });

  return function cleanup() {
    clearInterval(chatTimer);
    if (voice.joined) leaveVoice();
  };
}

// Best-effort: if the tab closes while the mic is live, let the room know.
// sendBeacon fires-and-forgets during unload, when a normal fetch would be cancelled.
window.addEventListener("pagehide", () => {
  if (activeVoiceContext) {
    const blob = new Blob([JSON.stringify({ ...activeVoiceContext, action: "leave" })], { type: "application/json" });
    navigator.sendBeacon("/api/room-voice-presence", blob);
  }
});

function render() {
  stopPolling();
  stopSidebar();
  const hash = location.hash.replace(/^#/, "") || "/";
  const [path, query] = hash.split("?");
  const params = new URLSearchParams(query || "");
  const parts = path.split("/").filter(Boolean);

  if (parts.length === 0) return renderHome();
  if (parts[0] === "new") return renderNew();
  if (parts[0] === "join") return renderJoin();
  if (parts[0] === "login") return renderLogin();
  if (parts[0] === "username") return renderUsername();
  if (parts[0] === "history") return renderHistory();
  if (parts[0] === "room" && parts[1]) return renderRoom(parts[1].toUpperCase(), params.get("seat"));
  return renderHome();
}

function navLinks() {
  if (currentUser && currentUsername) {
    return `<span class="chip">@${escapeHtml(currentUsername)}</span><a href="#/history">History</a><a href="#" id="signOutLink">Sign out</a>`;
  }
  return `<a href="#/login">Sign in</a>`;
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function layout(body) {
  $app.style.maxWidth = "760px";
  $app.innerHTML = "";
  $app.appendChild(el(`
    <div style="display:flex;flex-direction:column;gap:24px;">
      <nav>
        <a class="brand" href="#/">🌿 Draft Night</a>
        <div class="links">${navLinks()}</div>
      </nav>
      <div id="body"></div>
    </div>
  `));
  document.getElementById("body").appendChild(body);
  const signOut = document.getElementById("signOutLink");
  if (signOut) signOut.addEventListener("click", async (e) => {
    e.preventDefault();
    if (sbClient) await sbClient.auth.signOut();
    currentUser = null; currentUsername = null;
    navigate("/");
  });
}

/** One-time shell for the room view: nav + a #body/#sidebar pair that persists
 * across game-state redraws, so the chat box and voice controls never get torn
 * down and rebuilt (which would wipe a typed message or a live mic connection). */
function layoutRoom() {
  $app.style.maxWidth = "1040px";
  $app.innerHTML = "";
  $app.appendChild(el(`
    <div style="display:flex;flex-direction:column;gap:24px;">
      <nav>
        <a class="brand" href="#/">🌿 Draft Night</a>
        <div class="links">${navLinks()}</div>
      </nav>
      <div class="room-wrap">
        <div id="body"></div>
        <div id="sidebar" class="panel">
          <div class="tabrow">
            <button class="tabbtn active" data-tab="chat" type="button">💬 Chat</button>
            <button class="tabbtn" data-tab="voice" type="button">🎙️ Voice</button>
          </div>
          <div id="chatTab" class="tabpane" style="display:flex;">
            <div id="chatMessages"></div>
            <form id="chatForm" style="display:flex;gap:6px;">
              <input id="chatInput" class="input" placeholder="Say something…" maxlength="500" autocomplete="off" />
              <button class="btn btn-primary" type="submit">Send</button>
            </form>
          </div>
          <div id="voiceTab" class="tabpane" style="display:none;">
            <button class="btn btn-primary" id="voiceToggleBtn" type="button">🎙️ Join voice</button>
            <button class="btn btn-ghost" id="muteToggleBtn" type="button" style="display:none;">Mute</button>
            <p class="small muted" id="voiceRoster">Nobody's in voice yet.</p>
            <p class="xs muted">Live mic chat, direct between browsers. Works great on most home wifi — may not connect over some mobile networks or office firewalls.</p>
          </div>
        </div>
      </div>
    </div>
  `));
  const signOut = document.getElementById("signOutLink");
  if (signOut) signOut.addEventListener("click", async (e) => {
    e.preventDefault();
    if (sbClient) await sbClient.auth.signOut();
    currentUser = null; currentUsername = null;
    navigate("/");
  });
  $app.querySelectorAll(".tabbtn").forEach((btn) => {
    btn.addEventListener("click", () => {
      $app.querySelectorAll(".tabbtn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("chatTab").style.display = btn.dataset.tab === "chat" ? "flex" : "none";
      document.getElementById("voiceTab").style.display = btn.dataset.tab === "voice" ? "flex" : "none";
    });
  });
}

/** Replaces only the game-content column, leaving the sidebar (and its live
 * chat/voice state) completely untouched. */
function setMain(contentEl) {
  const bodyEl = document.getElementById("body");
  bodyEl.innerHTML = "";
  bodyEl.appendChild(contentEl);
}

/* ---------- home ---------- */
function renderHome() {
  layout(el(`
    <div style="display:flex;flex-direction:column;gap:32px;">
      <section style="display:flex;flex-direction:column;gap:16px;padding:24px 0;">
        <p class="xs muted" style="text-transform:uppercase;letter-spacing:0.15em;">2 to 5 players · one bankroll each · nothing but nerve</p>
        <h1 style="font-size:2.4rem;line-height:1.15;">Pull up a chair. Nobody's picking teams tonight — everybody's bidding.</h1>
        <p class="muted" style="max-width:520px;">The deck deals a name and starts a clock. Take it cheap, hand it off to a friend for free, or watch the table fight over it. There's no ranking telling you who's good — that's the whole fun of it, figuring it out yourselves.</p>
        <div class="row">
          <a href="#/new"><button class="btn btn-primary">Start a room</button></a>
          <a href="#/join"><button class="btn btn-ghost">Join with a code</button></a>
        </div>
        <p class="xs muted">No account needed to play — just share the code with your friends.</p>
      </section>
      <section class="panel">
        <h2 style="margin-bottom:14px;">How a round goes</h2>
        <ol class="steps small muted">
          <li><b style="color:var(--text)">A name flips.</b> The deck's hidden and shuffled — nobody knows what's coming.</li>
          <li><b style="color:var(--text)">Whoever's up chooses.</b> Take it for the minimum, or hand it to someone else at the table for free.</li>
          <li><b style="color:var(--text)">Everyone else can jump in.</b> Raise, drop out, raise again — the clock resets every time someone bids.</li>
          <li><b style="color:var(--text)">It settles.</b> The cash comes off the bankroll, the name lands on a roster, and the next one flips.</li>
        </ol>
      </section>
    </div>
  `));
}

/* ---------- new room ---------- */
function renderNew() {
  const nameField = (currentUser && currentUsername)
    ? `<p class="small muted">Playing as <b style="color:var(--text)">@${escapeHtml(currentUsername)}</b></p>`
    : `<label><span>Your name</span><input class="input" name="hostName" required placeholder="Ari" /></label>`;

  const body = el(`
    <form id="f" style="display:flex;flex-direction:column;gap:20px;max-width:520px;">
      <h1>Get a room going</h1>
      ${nameField}
      <div class="grid2">
        <label><span>How many are playing?</span>
          <select class="input" name="numPlayers">
            <option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
          </select>
        </label>
        <label><span>Roster size (each)</span><input class="input" type="number" name="rosterSize" min="3" max="15" value="5" /></label>
        <label><span>Bankroll (each)</span><input class="input" type="number" name="bankroll" min="5" max="1000" value="20" /></label>
        <label><span>Minimum bid</span><input class="input" type="number" name="minBid" min="1" max="50" value="1" /></label>
        <label><span>Counter-bid clock</span>
          <select class="input" name="clockSeconds">
            <option value="10">10s</option><option value="15" selected>15s</option><option value="20">20s</option><option value="30">30s</option>
          </select>
        </label>

      rosterSize: Number(fd.get("rosterSize")),
      bankroll: Number(fd.get("bankroll")),
      minBid: Number(fd.get("minBid")),
      clockSeconds: Number(fd.get("clockSeconds")),
      givesEach: Number(fd.get("givesEach")),

      navigate(`/room/${data.code}?seat=0`);

}

/* ---------- room ---------- */
function renderRoom(code, seatFromUrl) {
  if (seatFromUrl !== null && seatFromUrl !== undefined && seatFromUrl !== "") {
    localStorage.setItem(`seat:${code}`, seatFromUrl);
  }
  const storedSeat = localStorage.getItem(`seat:${code}`);
  const seat = storedSeat !== null ? Number(storedSeat) : null;

  layoutRoom();
  setMain(el(`<p class="muted">Finding the table…</p>`));
  sidebarCleanup = setupSidebar(code, seat);

  let bidAmount = 0;
  let giveTarget = null;
  let lastVersion = null;

  async function poll() {
    try {
      const state = await api(`/api/room-state?code=${code}`);
      // Skip re-rendering when nothing actually changed — a full redraw every
      // second would blow away whatever the person is mid-typing (like a bid
      // amount), and on mobile it also closes the on-screen keyboard.
      if (state.version === lastVersion) return;
      lastVersion = state.version;
      latestRoomState = state;
      draw(state);
    } catch (err) {
      setMain(el(`<p class="error">${err.message}</p>`));
      stopPolling();
    }
  }

  function draw(state) {
    if (state.status === "waiting") {
      const joined = state.players.map((p) => p.name).join(", ");
      setMain(el(`
        <div style="display:flex;flex-direction:column;gap:16px;">
          <h1>Waiting on the rest of the table</h1>
          <p class="muted">Share this code — you need ${state.settings.numPlayers} to start:</p>
          <p class="code">${state.code}</p>
          <p class="small">In so far: ${escapeHtml(joined)} (${state.players.length} of ${state.settings.numPlayers})</p>
          <p class="xs muted">This updates on its own once everyone's in.</p>
        </div>
      `));
      return;
    }

    if (state.status === "voting") {
      renderVoting(state, seat, (newState) => { lastVersion = newState.version; draw(newState); });
      return;
    }

    if (state.status === "finished") {
      renderResults(state);
      return;
    }

    const active = state.active;
    const wrap = el(`<div style="display:flex;flex-direction:column;gap:24px;"></div>`);
    wrap.appendChild(el(`
      <header class="row" style="justify-content:space-between;">
        <h1 style="font-size:1.1rem;">Room ${state.code}</h1>
        <span class="xs muted">${escapeHtml(state.settings.category)}</span>
      </header>
    `));

    const grid = el(`<div class="grid3"></div>`);
    state.players.forEach((p, idx) => {
      const left = state.settings.bankroll - p.spent;
      const isTurn = state.turn === idx && active && active.status === "deciding";
      grid.appendChild(seatPanel(p.name, state.settings.bankroll, left, p.givesLeft, p.roster, seat === idx, isTurn));
    });
    wrap.appendChild(grid);

    if (active) {
      const cardPanel = el(`
        <div class="panel" style="display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;">
          <p class="xs muted" style="text-transform:uppercase;letter-spacing:0.15em;">card ${state.deckIndex + 1} of ${state.settings.deckSize}</p>
          <h2 style="font-size:1.6rem;">${escapeHtml(active.name)}</h2>
          <div id="active-body" style="width:100%;display:flex;flex-direction:column;gap:14px;align-items:center;"></div>
        </div>
      `);
      const activeBody = cardPanel.querySelector("#active-body");

      if (active.status === "deciding") {
        const upName = state.players[state.turn].name;
        const whoText = state.turn === seat ? "Your call" : `${escapeHtml(upName)}'s call`;
        activeBody.appendChild(el(`<p class="small muted">${whoText}: take it for $${state.settings.minBid}, or hand it to someone else at the table for free.</p>`));
        if (seat !== null && state.turn === seat) {
          const givesLeft = state.players[seat].givesLeft;
          const others = state.players.map((p, i) => ({ p, i })).filter((o) => o.i !== seat);
          const targetPicker = others.length > 1
            ? `<select class="input" id="giveTarget" style="width:auto;">${others.map((o) => `<option value="${o.i}">${escapeHtml(o.p.name)}</option>`).join("")}</select>`
            : `<input type="hidden" id="giveTarget" value="${others[0] ? others[0].i : ""}" />`;
          const controls = el(`
            <div class="col" style="align-items:center;">
              <div class="row" style="justify-content:center;">
                <button class="btn btn-primary" id="takeBtn">Take for $${state.settings.minBid}</button>
              </div>
              <div class="row" style="justify-content:center;align-items:center;">
                <span class="xs muted">or give it to</span>
                ${targetPicker}
                <button class="btn btn-ghost" id="giveBtn" ${givesLeft <= 0 ? "disabled" : ""}>free (${givesLeft} left)</button>
              </div>
            </div>
          `);
          activeBody.appendChild(controls);
          controls.querySelector("#takeBtn").addEventListener("click", () => doAction({ type: "decide", seat, choice: "take" }));
          controls.querySelector("#giveBtn").addEventListener("click", () => {
            const t = Number(controls.querySelector("#giveTarget").value);
            doAction({ type: "decide", seat, choice: "give", targetSeat: t });
          });
        } else {
          activeBody.appendChild(el(`<p class="small muted">Hang tight…</p>`));
        }
      }

      if (active.status === "bidding" && active.deadline) {
        const holderName = state.players[active.holder].name;
        const holderText = active.holder === seat ? "You're holding the bid" : `${escapeHtml(holderName)} is holding the bid`;
        activeBody.appendChild(el(`<p class="small">${holderText} at <b>$${active.price}</b></p>`));
        const barWrap = el(`<div style="width:100%;max-width:260px;display:flex;flex-direction:column;gap:4px;">
          <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
          <span class="xs muted" id="secs" style="align-self:end;"></span>
        </div>`);
        activeBody.appendChild(barWrap);
        startCountdown(barWrap.querySelector("#bar"), barWrap.querySelector("#secs"), active.deadline, state.settings.clockSeconds);

        const iAmFull = seat !== null && state.players[seat].roster.length >= state.settings.rosterSize;
        const iHavePassed = seat !== null && active.passedBy.includes(seat);
        if (seat !== null && active.holder !== seat && !iAmFull && !iHavePassed) {
          if (!bidAmount || bidAmount <= active.price) bidAmount = active.price + 1;
          const controls = el(`
            <div class="row" style="justify-content:center;">
              <input class="input" type="number" id="bidInput" style="width:90px;" min="${active.price + 1}" value="${bidAmount}" />
              <button class="btn btn-primary" id="raiseBtn">Raise</button>
              <button class="btn btn-ghost" id="passBtn">Pass</button>
            </div>
          `);
          activeBody.appendChild(controls);
          controls.querySelector("#bidInput").addEventListener("input", (e) => { bidAmount = Number(e.target.value); });
          controls.querySelector("#raiseBtn").addEventListener("click", () => doAction({ type: "bid", seat, amount: bidAmount }));
          controls.querySelector("#passBtn").addEventListener("click", () => doAction({ type: "pass", seat }));
        } else if (seat !== null) {
          activeBody.appendChild(el(`<p class="xs muted">Waiting on the rest of the table…</p>`));
        }
      }

      wrap.appendChild(cardPanel);
    }

    const errHolder = el(`<p class="error" style="display:none;"></p>`);
    wrap.appendChild(errHolder);

    setMain(wrap);

    async function doAction(payload) {
      try {
        const data = await api("/api/room-action", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: state.code, ...payload }),
        });
        lastVersion = data.version;
        draw(data);
      } catch (err) {
        errHolder.textContent = err.message;
        errHolder.style.display = "block";
      }
    }
  }

  poll();
  pollTimer = setInterval(poll, 1000);
}

function seatPanel(name, bankroll, left, gives, entries, isMe, isTurn) {
  const rosterHtml = entries.map((e, i) => `<li><span>${i + 1}. ${escapeHtml(e.name)}</span><span>${e.price === 0 ? "free" : "$" + e.price}</span></li>`).join("");
  return el(`
    <div class="panel${isTurn ? " turn" : ""}" style="display:flex;flex-direction:column;gap:6px;">
      <div class="row" style="justify-content:space-between;">
        <span style="font-weight:600;">${escapeHtml(name)}${isMe ? " (you)" : ""}</span>
        <span class="xs muted">$${bankroll - left} of $${bankroll}</span>
      </div>
      <p class="xs muted" style="margin:0;">$${left} left · ${gives} gives left</p>
      <ol class="roster">${rosterHtml}</ol>
    </div>
  `);
}

function startCountdown(barEl, secsEl, deadline, totalSeconds) {
  function tick() {
    const remainingMs = Math.max(0, deadline - Date.now());
    const pct = Math.max(0, Math.min(100, (remainingMs / (totalSeconds * 1000)) * 100));
    barEl.style.width = pct + "%";
    secsEl.textContent = Math.ceil(remainingMs / 1000) + "s";
    if (remainingMs > 0) requestAnimationFrame(tick);
  }
  tick();
}

/* ---------- post-draft voting ---------- */
function renderVoting(state, seat, redraw) {
  const wrap = el(`<div style="display:flex;flex-direction:column;gap:20px;"></div>`);
  wrap.appendChild(el(`<h1>The draft's done — how should we crown a winner?</h1>`));

  const errHolder = el(`<p class="error" style="display:none;"></p>`);

  async function vote(payload) {
    errHolder.style.display = "none";
    try {
      const data = await api("/api/room-action", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: state.code, ...payload }),
      });
      redraw(data);
    } catch (err) {
      errHolder.textContent = err.message;
      errHolder.style.display = "block";
    }
  }

  if (state.votePhase === "method") {
    const votes = state.methodVotes || {};
    const iVoted = seat !== null && votes[seat] !== undefined;
    const votedCount = Object.keys(votes).length;
    wrap.appendChild(el(`
      <div class="panel" style="display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;">
        <p class="muted small">${votedCount} of ${state.players.length} have weighed in.</p>
        ${iVoted
          ? `<p class="small">You picked <b>${votes[seat] === "ai" ? "let the AI decide" : "let us vote"}</b> — waiting on the rest of the table.</p>`
          : `<div class="row" style="justify-content:center;">
               <button class="btn btn-primary" id="voteAi">🤖 Let the AI decide</button>
               <button class="btn btn-ghost" id="votePlayers">🗳️ Let us vote</button>
             </div>`
        }
        <p class="xs muted">Majority rules. A tie hands it to the AI.</p>
      </div>
    `));
    wrap.appendChild(errHolder);
    setMain(wrap);
    if (!iVoted && seat !== null) {
      wrap.querySelector("#voteAi").addEventListener("click", () => vote({ type: "vote-method", seat, choice: "ai" }));
      wrap.querySelector("#votePlayers").addEventListener("click", () => vote({ type: "vote-method", seat, choice: "players" }));
    }
    return;
  }

  if (state.votePhase === "players") {
    const votes = state.winnerVotes || {};
    const iVoted = seat !== null && votes[seat] !== undefined;
    const votedCount = Object.keys(votes).length;
    const options = state.players.map((p, i) => `
      <button class="btn btn-ghost" data-seat="${i}">${escapeHtml(p.name)}</button>
    `).join("");
    wrap.appendChild(el(`
      <div class="panel" style="display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;">
        <p class="muted small">${votedCount} of ${state.players.length} have voted. Who had the best draft?</p>
        ${iVoted
          ? `<p class="small">You voted for <b>${escapeHtml(state.players[votes[seat]].name)}</b> — waiting on the rest of the table.</p>`
          : `<div class="row" style="justify-content:center;">${options}</div>`
        }
        <p class="xs muted">A tie hands it to the AI to break.</p>
      </div>
    `));
    wrap.appendChild(errHolder);
    setMain(wrap);
    if (!iVoted && seat !== null) {
      wrap.querySelectorAll("[data-seat]").forEach((btn) => {
        btn.addEventListener("click", () => vote({ type: "vote-winner", seat, targetSeat: Number(btn.dataset.seat) }));
      });
    }
    return;
  }

  // ai_pending — server retries this automatically on every vote and every poll
  const errMsg = state.aiError
    ? `<p class="error" style="margin-top:8px;">${escapeHtml(state.aiError)}</p>`
    : "";
  const retryWrap = el(`
    <div class="panel" style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;">
      <p class="small muted">The commissioner is looking over everyone's roster…</p>
      ${errMsg}
      ${state.aiError ? `<button class="btn btn-ghost" id="retryAi">Try again</button>` : ""}
    </div>
  `);
  wrap.appendChild(retryWrap);
  setMain(wrap);
  const retryBtn = wrap.querySelector("#retryAi");
  if (retryBtn) retryBtn.addEventListener("click", async () => {
    retryBtn.disabled = true; retryBtn.textContent = "Retrying…";
    try {
      const data = await api("/api/room-action", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: state.code, type: "retry-ai" }),
      });
      redraw(data);
    } catch (err) {
      retryBtn.disabled = false; retryBtn.textContent = "Try again";
    }
  });
}

/* ---------- results board ---------- */
function winnerBanner(state) {
  if (state.winnerSeat === null || state.winnerSeat === undefined) return "";
  const winner = state.players[state.winnerSeat];
  const byLine = state.winnerReason
    ? `<p class="small" style="margin:6px 0 0;max-width:420px;">${escapeHtml(state.winnerReason)}</p>`
    : `<p class="xs muted" style="margin:6px 0 0;">Voted best draft by the table.</p>`;
  return `
    <div class="panel" style="text-align:center;border-color:var(--accent);">
      <p class="xs muted" style="text-transform:uppercase;letter-spacing:0.15em;margin:0;">best draft of the night</p>
      <h2 style="margin-top:4px;">🏆 ${escapeHtml(winner.name)}</h2>
      ${byLine}
    </div>
  `;
}

function renderResults(state) {
  const all = state.players.flatMap((p) => p.roster);
  const priciest = [...all].sort((a, b) => b.price - a.price)[0];

  function rosterCol(p) {
    const left = state.settings.bankroll - p.spent;
    const items = p.roster.map((e, i) => `<li><span>${i + 1}. ${escapeHtml(e.name)}</span><span>${e.price === 0 ? "free" : "$" + e.price}</span></li>`).join("");
    return `
      <div style="display:flex;flex-direction:column;gap:2px;">
        <div class="row" style="justify-content:space-between;">
          <span style="font-weight:600;font-size:0.85rem;">${escapeHtml(p.name)}</span>
          <span class="xs muted">$${state.settings.bankroll - left} of $${state.settings.bankroll}</span>
        </div>
        <ol class="roster">${items}</ol>
        <p class="xs" style="color:var(--accent-dark);align-self:end;margin:2px 0 0;">finished with $${left}</p>
      </div>
    `;
  }

  const body = el(`
    <div style="display:flex;flex-direction:column;gap:20px;align-items:center;">
      <h1>That's a wrap</h1>
      ${winnerBanner(state)}
      <div id="results-board">
        <div style="text-align:center;">
          <p class="xs muted" style="text-transform:uppercase;letter-spacing:0.15em;margin:0;">the $${state.settings.bankroll} draft</p>
          <h2>${escapeHtml(state.settings.category)}</h2>
        </div>
        ${state.players.map(rosterCol).join("")}
        ${priciest ? `<p class="xs muted" style="text-align:center;margin-top:auto;">Biggest splurge: ${escapeHtml(priciest.name)} $${priciest.price}</p>` : ""}
        <p class="xs muted" style="text-align:center;opacity:0.6;">Draft Night · $${state.settings.bankroll} each · ${state.settings.rosterSize} each · ${state.players.length} players</p>
      </div>
      <button class="btn btn-primary" id="downloadBtn">Download PNG</button>
    </div>
  `);
  setMain(body);

  body.querySelector("#downloadBtn").addEventListener("click", async () => {
    const btn = body.querySelector("#downloadBtn");
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const dataUrl = await htmlToImage.toPng(document.getElementById("results-board"), { pixelRatio: 2, backgroundColor: "#fffaf1" });
      const link = document.createElement("a");
      link.download = `draft-night-${state.code}.png`;
      link.href = dataUrl;
      link.click();
    } finally {
      btn.disabled = false; btn.textContent = "Download PNG";
    }
  });
}
</script>
</body>
</html>
