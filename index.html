<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Auction Draft — the $20 head-to-head draft game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>" />
<style>
  :root {
    --ink: #0f1117;
    --panel: #171923;
    --line: #262b3a;
    --accent: #4f7dff;
    --text: #f2f3f7;
    --muted: #9aa0ae;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 760px; margin: 0 auto; padding: 32px 16px; display: flex; flex-direction: column; gap: 24px; }
  a { color: inherit; }
  h1 { font-size: 1.75rem; font-weight: 800; margin: 0; }
  h2 { font-size: 1.25rem; font-weight: 700; margin: 0; }
  p { line-height: 1.5; }
  .muted { color: var(--muted); }
  .small { font-size: 0.8rem; }
  .xs { font-size: 0.7rem; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .panel.turn { border-color: var(--accent); }
  .btn { border-radius: 10px; padding: 10px 18px; font-weight: 600; border: none; cursor: pointer; font-size: 0.95rem; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); }
  .input, select, textarea { background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text); width: 100%; font-size: 0.95rem; font-family: inherit; }
  .input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label span { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  nav { display: flex; justify-content: space-between; align-items: center; }
  nav .brand { font-weight: 800; }
  nav .links { display: flex; gap: 16px; font-size: 0.9rem; }
  ol.roster { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  ol.roster li { display: flex; justify-content: space-between; font-size: 0.8rem; color: #cfd3dd; }
  .code { font-size: 2.5rem; font-family: ui-monospace, monospace; letter-spacing: 0.3em; color: var(--accent); }
  .bar-track { height: 8px; width: 100%; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); transition: width 0.1s linear; }
  .error { color: #ff6b6b; font-size: 0.9rem; }
  .steps { display: flex; flex-direction: column; gap: 10px; padding-left: 18px; }
  #results-board { width: 320px; aspect-ratio: 9/16; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; margin: 0 auto; }
</style>
</head>
<body>
<div id="app"><p class="muted">Loading…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
<script>
/* ---------- tiny helpers ---------- */
const $app = document.getElementById("app");
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const CATEGORIES = ["football", "movies", "pop icons", "custom"];

async function api(path, opts) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch(path, { ...opts, signal: controller.signal });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Request failed.");
    return data;
  } finally {
    clearTimeout(timeout);
  }
}

/* ---------- supabase (config fetched from /api/config) ---------- */
let supabase = null;
let currentUser = null;
async function initSupabase() {
  try {
    const cfg = await api("/api/config");
    if (cfg.supabaseUrl && cfg.supabaseAnonKey) {
      supabase = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      const { data } = await supabase.auth.getUser();
      currentUser = data.user || null;
    }
  } catch (e) {
    console.warn("Supabase not configured yet:", e.message);
  }
}

/* ---------- router ---------- */
function navigate(hash) { location.hash = hash; }
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", () => {
  render(); // show the UI immediately, don't block on network
  initSupabase().then(() => {
    // once we know sign-in state, re-render if the current view depends on it
    const hash = location.hash.replace(/^#/, "") || "/";
    if (hash === "/" || hash.startsWith("/login") || hash.startsWith("/history")) render();
  });
});

let pollTimer = null;
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

function render() {
  stopPolling();
  const hash = location.hash.replace(/^#/, "") || "/";
  const [path, query] = hash.split("?");
  const params = new URLSearchParams(query || "");
  const parts = path.split("/").filter(Boolean);

  if (parts.length === 0) return renderHome();
  if (parts[0] === "new") return renderNew();
  if (parts[0] === "join") return renderJoin();
  if (parts[0] === "login") return renderLogin();
  if (parts[0] === "history") return renderHistory();
  if (parts[0] === "room" && parts[1]) return renderRoom(parts[1].toUpperCase(), params.get("seat"));
  return renderHome();
}

function layout(navRight, body) {
  $app.innerHTML = "";
  $app.appendChild(el(`
    <div style="display:flex;flex-direction:column;gap:24px;">
      <nav>
        <a class="brand" href="#/">Auction Draft</a>
        <div class="links">${navRight}</div>
      </nav>
      <div id="body"></div>
    </div>
  `));
  document.getElementById("body").appendChild(body);
}

/* ---------- home ---------- */
function renderHome() {
  const navRight = currentUser
    ? `<a href="#/history">History</a>`
    : `<a href="#/login">Sign in</a>`;
  layout(navRight, el(`
    <div style="display:flex;flex-direction:column;gap:32px;">
      <section style="display:flex;flex-direction:column;gap:16px;padding:32px 0;">
        <p class="xs muted" style="text-transform:uppercase;letter-spacing:0.15em;">two players · one bankroll · no positions</p>
        <h1 style="font-size:2.5rem;">You don't pick. You pay.</h1>
        <p class="muted" style="max-width:520px;">A head-to-head auction draft: the deck deals you a name and starts a clock.
        There are no positions and no rankings — nothing in the app tells you who is good. That argument is the game.</p>
        <div class="row">
          <a href="#/new"><button class="btn btn-primary">Start a room</button></a>
          <a href="#/join"><button class="btn btn-ghost">Join with a code</button></a>
        </div>
        <p class="xs muted">No signup required. Your opponent just needs the code.</p>
      </section>
      <section class="panel">
        <h2 style="margin-bottom:14px;">How a card goes</h2>
        <ol class="steps small muted">
          <li><b style="color:var(--text)">The deck deals.</b> The server shuffles a hidden deck and flips one name at a time.</li>
          <li><b style="color:var(--text)">Whoever is up decides.</b> Take for the minimum, or give it to your opponent for free.</li>
          <li><b style="color:var(--text)">The other one bids.</b> Raise, pass, raise again. The clock resets on every raise.</li>
          <li><b style="color:var(--text)">It locks.</b> The money comes off, the name lands on a roster, the next card flips.</li>
        </ol>
      </section>
    </div>
  `));
}

/* ---------- new room ---------- */
function renderNew() {
  const navRight = `<a href="#/">Home</a>`;
  const body = el(`
    <form id="f" style="display:flex;flex-direction:column;gap:20px;max-width:520px;">
      <h1>Start a room</h1>
      <label><span>Your name</span><input class="input" name="hostName" required placeholder="Ari" /></label>
      <div class="grid2">
        <label><span>Roster size</span><input class="input" type="number" name="rosterSize" min="3" max="15" value="5" /></label>
        <label><span>Bankroll (each)</span><input class="input" type="number" name="bankroll" min="5" max="1000" value="20" /></label>
        <label><span>Minimum bid</span><input class="input" type="number" name="minBid" min="1" max="50" value="1" /></label>
        <label><span>Counter-bid clock</span>
          <select class="input" name="clockSeconds">
            <option value="10">10s</option><option value="15" selected>15s</option><option value="20">20s</option><option value="30">30s</option>
          </select>
        </label>
        <label><span>Gives each</span><input class="input" type="number" name="givesEach" min="0" max="10" value="2" /></label>
        <label><span>Category</span>
          <select class="input" name="category">${CATEGORIES.map((c) => `<option value="${c}">${c}</option>`).join("")}</select>
        </label>
      </div>
      <label id="customWrap" style="display:none;">
        <span>Custom names (one per line or comma separated — need at least roster×2)</span>
        <textarea class="input" name="customDeck" rows="5" placeholder="Name one&#10;Name two&#10;Name three..."></textarea>
      </label>
      <p class="error" id="err" style="display:none;"></p>
      <button class="btn btn-primary" style="align-self:start;" type="submit">Create room</button>
    </form>
  `);
  layout(navRight, body);

  const form = body.querySelector("#f");
  const categorySel = form.querySelector('[name="category"]');
  const customWrap = body.querySelector("#customWrap");
  categorySel.addEventListener("change", () => { customWrap.style.display = categorySel.value === "custom" ? "block" : "none"; });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = body.querySelector("#err");
    errEl.style.display = "none";
    const fd = new FormData(form);
    const payload = {
      hostName: fd.get("hostName"),
      rosterSize: Number(fd.get("rosterSize")),
      bankroll: Number(fd.get("bankroll")),
      minBid: Number(fd.get("minBid")),
      clockSeconds: Number(fd.get("clockSeconds")),
      givesEach: Number(fd.get("givesEach")),
      category: fd.get("category"),
      customDeck: fd.get("category") === "custom" ? fd.get("customDeck") : null,
      hostUserId: currentUser ? currentUser.id : null,
    };
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true; submitBtn.textContent = "Creating…";
    try {
      const data = await api("/api/room-create", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      localStorage.setItem(`seat:${data.code}`, "host");
      navigate(`/room/${data.code}?seat=host`);
    } catch (err) {
      errEl.textContent = err.message; errEl.style.display = "block";
      submitBtn.disabled = false; submitBtn.textContent = "Create room";
    }
  });
}

/* ---------- join ---------- */
function renderJoin() {
  const navRight = `<a href="#/">Home</a>`;
  const body = el(`
    <form id="f" style="display:flex;flex-direction:column;gap:20px;max-width:360px;">
      <h1>Join with a code</h1>
      <label><span>Room code</span><input class="input" name="code" maxlength="5" style="text-transform:uppercase;letter-spacing:0.2em;" required /></label>
      <label><span>Your name</span><input class="input" name="guestName" required placeholder="Bo" /></label>
      <p class="error" id="err" style="display:none;"></p>
      <button class="btn btn-primary" style="align-self:start;" type="submit">Join room</button>
    </form>
  `);
  layout(navRight, body);
  const form = body.querySelector("#f");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = body.querySelector("#err");
    errEl.style.display = "none";
    const fd = new FormData(form);
    const code = fd.get("code").trim().toUpperCase();
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true; submitBtn.textContent = "Joining…";
    try {
      await api("/api/room-join", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, guestName: fd.get("guestName"), guestUserId: currentUser ? currentUser.id : null }),
      });
      localStorage.setItem(`seat:${code}`, "guest");
      navigate(`/room/${code}?seat=guest`);
    } catch (err) {
      errEl.textContent = err.message; errEl.style.display = "block";
      submitBtn.disabled = false; submitBtn.textContent = "Join room";
    }
  });
}

/* ---------- login ---------- */
function renderLogin() {
  const navRight = `<a href="#/">Home</a>`;
  if (!supabase) {
    layout(navRight, el(`<p class="muted">Accounts aren't configured for this deployment yet.</p>`));
    return;
  }
  const body = el(`
    <form id="f" style="display:flex;flex-direction:column;gap:20px;max-width:360px;">
      <h1>Sign in</h1>
      <p class="small muted">Signing in isn't required to play — it just saves your game history.</p>
      <label><span>Email</span><input class="input" type="email" name="email" required /></label>
      <p class="error" id="err" style="display:none;"></p>
      <p class="small" id="sent" style="display:none;">Check your email for a sign-in link.</p>
      <button class="btn btn-primary" style="align-self:start;" type="submit">Send magic link</button>
    </form>
  `);
  layout(navRight, body);
  const form = body.querySelector("#f");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = body.querySelector("#err");
    const sentEl = body.querySelector("#sent");
    errEl.style.display = "none";
    const email = new FormData(form).get("email");
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true; submitBtn.textContent = "Sending…";
    const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin } });
    submitBtn.disabled = false; submitBtn.textContent = "Send magic link";
    if (error) { errEl.textContent = error.message; errEl.style.display = "block"; }
    else { sentEl.style.display = "block"; }
  });
}

/* ---------- history ---------- */
async function renderHistory() {
  const navRight = `<a href="#/">Home</a>`;
  if (!supabase || !currentUser) {
    layout(navRight, el(`<div><h1>Your games</h1><p class="muted"><a href="#/login" style="color:var(--accent);">Sign in</a> to see your game history here.</p></div>`));
    return;
  }
  layout(navRight, el(`<p class="muted">Loading…</p>`));
  const { data: games } = await supabase.from("games").select("*").order("finished_at", { ascending: false }).limit(50);
  const list = (games || []).map((g) => `
    <div class="panel row" style="justify-content:space-between;">
      <div>
        <p style="margin:0;font-weight:600;">${g.host_name} vs ${g.guest_name || "?"}</p>
        <p class="xs muted" style="margin:2px 0 0;">${g.category} · ${new Date(g.finished_at).toLocaleString()}</p>
      </div>
      <span class="xs muted">${g.code}</span>
    </div>
  `).join("") || `<p class="muted">No finished games yet.</p>`;
  layout(navRight, el(`<div style="display:flex;flex-direction:column;gap:16px;"><h1>Your games</h1>${list}</div>`));
}

/* ---------- room ---------- */
function renderRoom(code, seatFromUrl) {
  if (seatFromUrl === "host" || seatFromUrl === "guest") localStorage.setItem(`seat:${code}`, seatFromUrl);
  const seat = localStorage.getItem(`seat:${code}`);
  const navRight = `<a href="#/">Home</a>`;
  layout(navRight, el(`<p class="muted">Loading room…</p>`));

  let bidAmount = 0;

  async function poll() {
    try {
      const state = await api(`/api/room-state?code=${code}`);
      draw(state);
    } catch (err) {
      layout(navRight, el(`<p class="error">${err.message}</p>`));
      stopPolling();
    }
  }

  function draw(state) {
    if (state.status === "waiting") {
      layout(navRight, el(`
        <div style="display:flex;flex-direction:column;gap:16px;">
          <h1>Room ${state.code}</h1>
          <p class="muted">Waiting for an opponent. Share this code:</p>
          <p class="code">${state.code}</p>
          <p class="xs muted">${state.hostName} is in. This page updates automatically once someone joins.</p>
        </div>
      `));
      return;
    }

    if (state.status === "finished") {
      renderResults(state);
      return;
    }

    const active = state.active;
    const oppSeat = seat === "host" ? "guest" : (seat === "guest" ? "host" : null);
    const hostLeft = state.settings.bankroll - state.spent.host;
    const guestLeft = state.settings.bankroll - state.spent.guest;

    const wrap = el(`<div style="display:flex;flex-direction:column;gap:24px;"></div>`);
    wrap.appendChild(el(`
      <header class="row" style="justify-content:space-between;">
        <h1 style="font-size:1.1rem;">Room ${state.code}</h1>
        <span class="xs muted">${state.settings.category}</span>
      </header>
    `));

    const grid = el(`<div class="grid2"></div>`);
    grid.appendChild(seatPanel(state.hostName, state.settings.bankroll, hostLeft, state.givesLeft.host, state.rosters.host, seat === "host", state.turn === "host" && active && active.status === "deciding"));
    grid.appendChild(seatPanel(state.guestName || "Guest", state.settings.bankroll, guestLeft, state.givesLeft.guest, state.rosters.guest, seat === "guest", state.turn === "guest" && active && active.status === "deciding"));
    wrap.appendChild(grid);

    if (active) {
      const cardPanel = el(`
        <div class="panel" style="display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;">
          <p class="xs muted" style="text-transform:uppercase;letter-spacing:0.15em;">card ${state.deckIndex + 1} of ${state.settings.deckSize}</p>
          <h2 style="font-size:1.6rem;">${active.name}</h2>
          <div id="active-body" style="width:100%;display:flex;flex-direction:column;gap:14px;align-items:center;"></div>
        </div>
      `);
      const activeBody = cardPanel.querySelector("#active-body");

      if (active.status === "deciding") {
        const whoText = state.turn === seat ? "You decide" : (seat ? "Your opponent decides" : `${state.turn === "host" ? state.hostName : state.guestName} decides`);
        activeBody.appendChild(el(`<p class="small muted">${whoText}: take for $${state.settings.minBid}, or give it away free.</p>`));
        if (seat && state.turn === seat) {
          const givesLeft = state.givesLeft[seat];
          const controls = el(`
            <div class="row" style="justify-content:center;">
              <button class="btn btn-primary" id="takeBtn">Take for $${state.settings.minBid}</button>
              <button class="btn btn-ghost" id="giveBtn" ${givesLeft <= 0 ? "disabled" : ""}>Give away free (${givesLeft} left)</button>
            </div>
          `);
          activeBody.appendChild(controls);
          controls.querySelector("#takeBtn").addEventListener("click", () => doAction({ type: "decide", seat, choice: "take" }));
          controls.querySelector("#giveBtn").addEventListener("click", () => doAction({ type: "decide", seat, choice: "give" }));
        } else {
          activeBody.appendChild(el(`<p class="small muted">Waiting…</p>`));
        }
      }

      if (active.status === "bidding" && active.deadline) {
        const holderText = active.holder === seat ? "You hold the bid" : "Opponent holds the bid";
        activeBody.appendChild(el(`<p class="small">${holderText} at <b>$${active.price}</b></p>`));
        const barWrap = el(`<div style="width:100%;max-width:260px;display:flex;flex-direction:column;gap:4px;">
          <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
          <span class="xs muted" id="secs" style="align-self:end;"></span>
        </div>`);
        activeBody.appendChild(barWrap);
        startCountdown(barWrap.querySelector("#bar"), barWrap.querySelector("#secs"), active.deadline, state.settings.clockSeconds);

        if (seat && active.holder !== seat) {
          if (!bidAmount || bidAmount <= active.price) bidAmount = active.price + 1;
          const controls = el(`
            <div class="row" style="justify-content:center;">
              <input class="input" type="number" id="bidInput" style="width:90px;" min="${active.price + 1}" value="${bidAmount}" />
              <button class="btn btn-primary" id="raiseBtn">Raise</button>
              <button class="btn btn-ghost" id="passBtn">Pass</button>
            </div>
          `);
          activeBody.appendChild(controls);
          controls.querySelector("#bidInput").addEventListener("input", (e) => { bidAmount = Number(e.target.value); });
          controls.querySelector("#raiseBtn").addEventListener("click", () => doAction({ type: "bid", seat, amount: bidAmount }));
          controls.querySelector("#passBtn").addEventListener("click", () => doAction({ type: "pass", seat }));
        } else if (seat) {
          activeBody.appendChild(el(`<p class="xs muted">Waiting on your opponent to raise or pass…</p>`));
        }
      }

      wrap.appendChild(cardPanel);
    }

    const errHolder = el(`<p class="error" style="display:none;"></p>`);
    wrap.appendChild(errHolder);

    layout(navRight, wrap);

    async function doAction(payload) {
      try {
        const data = await api("/api/room-action", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: state.code, ...payload }),
        });
        draw(data);
      } catch (err) {
        errHolder.textContent = err.message;
        errHolder.style.display = "block";
      }
    }
  }

  poll();
  pollTimer = setInterval(poll, 1000);
}

function seatPanel(name, bankroll, left, gives, entries, isMe, isTurn) {
  const rosterHtml = entries.map((e, i) => `<li><span>${i + 1}. ${e.name}</span><span>${e.price === 0 ? "free" : "$" + e.price}</span></li>`).join("");
  return el(`
    <div class="panel${isTurn ? " turn" : ""}" style="display:flex;flex-direction:column;gap:6px;">
      <div class="row" style="justify-content:space-between;">
        <span style="font-weight:600;">${name}${isMe ? " (you)" : ""}</span>
        <span class="xs muted">$${bankroll - left} of $${bankroll}</span>
      </div>
      <p class="xs muted" style="margin:0;">$${left} left · ${gives} gives left</p>
      <ol class="roster">${rosterHtml}</ol>
    </div>
  `);
}

function startCountdown(barEl, secsEl, deadline, totalSeconds) {
  function tick() {
    const remainingMs = Math.max(0, deadline - Date.now());
    const pct = Math.max(0, Math.min(100, (remainingMs / (totalSeconds * 1000)) * 100));
    barEl.style.width = pct + "%";
    secsEl.textContent = Math.ceil(remainingMs / 1000) + "s";
    if (remainingMs > 0) requestAnimationFrame(tick);
  }
  tick();
}

/* ---------- results board ---------- */
function renderResults(state) {
  const navRight = `<a href="#/">Home</a>`;
  const hostLeft = state.settings.bankroll - state.spent.host;
  const guestLeft = state.settings.bankroll - state.spent.guest;
  const all = [...state.rosters.host, ...state.rosters.guest].sort((a, b) => b.price - a.price);
  const priciest = all[0];

  function rosterCol(name, entries, left) {
    const items = entries.map((e, i) => `<li><span>${i + 1}. ${e.name}</span><span>${e.price === 0 ? "free" : "$" + e.price}</span></li>`).join("");
    return `
      <div style="display:flex;flex-direction:column;gap:2px;">
        <div class="row" style="justify-content:space-between;">
          <span style="font-weight:600;font-size:0.85rem;">${name}</span>
          <span class="xs muted">$${state.settings.bankroll - left} of $${state.settings.bankroll}</span>
        </div>
        <ol class="roster">${items}</ol>
        <p class="xs" style="color:var(--accent);align-self:end;margin:2px 0 0;">finished with $${left}</p>
      </div>
    `;
  }

  const body = el(`
    <div style="display:flex;flex-direction:column;gap:20px;align-items:center;">
      <h1>Final board</h1>
      <div id="results-board">
        <div style="text-align:center;">
          <p class="xs muted" style="text-transform:uppercase;letter-spacing:0.15em;margin:0;">the $${state.settings.bankroll} auction draft</p>
          <h2>${state.settings.category}</h2>
        </div>
        ${rosterCol(state.hostName, state.rosters.host, hostLeft)}
        ${rosterCol(state.guestName || "Guest", state.rosters.guest, guestLeft)}
        ${priciest ? `<p class="xs muted" style="text-align:center;margin-top:auto;">Priciest pick: ${priciest.name} $${priciest.price}</p>` : ""}
        <p class="xs muted" style="text-align:center;opacity:0.6;">Auction Draft · $${state.settings.bankroll} each · ${state.settings.rosterSize} players</p>
      </div>
      <button class="btn btn-primary" id="downloadBtn">Download PNG</button>
    </div>
  `);
  layout(navRight, body);

  body.querySelector("#downloadBtn").addEventListener("click", async () => {
    const btn = body.querySelector("#downloadBtn");
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const dataUrl = await htmlToImage.toPng(document.getElementById("results-board"), { pixelRatio: 2, backgroundColor: "#0f1117" });
      const link = document.createElement("a");
      link.download = `auction-draft-${state.code}.png`;
      link.href = dataUrl;
      link.click();
    } finally {
      btn.disabled = false; btn.textContent = "Download PNG";
    }
  });
}
</script>
</body>
</html>
